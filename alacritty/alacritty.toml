[colors]
# primary.background = "#000000"
# primary.foreground = "#eeeeee"
cursor = { text = "CellBackground", cursor = "CellForeground" } # default
selection =  { text = "#008d60", background = "#2e2e2e" }

[cursor]
style = { shape = "Underline", blinking = "On" }

[mouse]
hide_when_typing = true

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic"}
size = 12.0

[window]
# opacity = 0.7
padding = { x = 10, y = 10 }
# dynamic_padding = true
decorations = "None"
# blur = true # not available linux
# startup_mode = "Maximized"
title = 'OviedoSp'
# dynamic_title = false # default true
decorations_theme_variant = "Dark"

